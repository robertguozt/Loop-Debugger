[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopdbg"
version = "1.0.0"
description = "An autonomous debugging agent: an Anthropic tool-use loop that patches code inside a Kubernetes sandbox."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Robert Guo" }]
keywords = ["anthropic", "claude", "tool-use", "kubernetes", "debugging", "agent"]
dependencies = [
  "anthropic>=0.40",
  "kubernetes>=29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5", "types-PyYAML"]

[project.scripts]
loopdbg = "loopdbg.cli:main"

[project.urls]
Homepage = "https://robertguozt.github.io/Loop-Debugger/"
Source = "https://github.com/robertguozt/Loop-Debugger"

[tool.setuptools]
packages = ["loopdbg"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["examples/broken_project"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "ARG", "C4", "PTH"]
ignore = ["B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "SLF001"]
"examples/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["loopdbg"]
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["kubernetes.*", "anthropic.*", "yaml"]
ignore_missing_imports = true
